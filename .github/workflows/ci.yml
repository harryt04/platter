name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
        volumes:
          - /tmp/mongo-data:/data/db
        command: mongod --replSet rs0 --bind_ip_all
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      MONGODB_DATABASE: platter_ci
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test --coverage
      - run: pnpm run build

  browser:
    needs: quality
    runs-on: ubuntu-22.04
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      MONGODB_DATABASE: platter_ci_browser
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm run build
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0
      - run: pnpm run db:indexes
      - run: pnpm exec playwright install --with-deps
      - name: Start realtime service
        run: |
          NODE_ENV=production pnpm run start:realtime > "$RUNNER_TEMP/platter-realtime.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/platter-realtime.log"
          exit 1
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/platter-realtime.log
          retention-days: 5
